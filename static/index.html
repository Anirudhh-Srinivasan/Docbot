<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>DocBot · Support</title>
  <style>
    :root { color-scheme: light dark; --bg:#f3f6fb; --panel:#fff; --text:#18243a; --muted:#64748b; --line:#dfe6ef; --accent:#5b62e8; --accent2:#454bc5; --user:#eef0ff; --error:#a63232; --shadow:0 18px 55px #20345d15; }
    @media (prefers-color-scheme:dark) { :root { --bg:#111522; --panel:#191f30; --text:#eef2ff; --muted:#a2adc4; --line:#2b354b; --accent:#9297ff; --accent2:#b8bbff; --user:#262c47; --error:#ff9b9b; --shadow:0 18px 55px #0005; } }
    * { box-sizing:border-box } body { margin:0; min-height:100vh; background:radial-gradient(ellipse at 50% -15%,#7f83ff24,transparent 55%),var(--bg); color:var(--text); font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(820px,calc(100% - 32px)); margin:0 auto; padding:54px 0 40px } .brand { display:flex; align-items:center; gap:13px; margin-bottom:36px } .logo { display:grid; place-items:center; width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#747aff,#454bc5);color:white;font-weight:800;box-shadow:0 8px 22px #575ede55 } .eyebrow { margin:0;color:var(--accent);font-size:12px;font-weight:750;letter-spacing:.12em;text-transform:uppercase } h1 { margin:2px 0 0;font-size:21px;letter-spacing:-.03em } .intro { margin:0 0 26px;color:var(--muted);font-size:15px } .chat { min-height:290px; padding:24px; border:1px solid var(--line);border-radius:20px;background:var(--panel);box-shadow:var(--shadow) } .welcome { max-width:460px;margin:28px auto;text-align:center;color:var(--muted) } .welcome strong { display:block;margin-bottom:7px;color:var(--text);font-size:18px } .turn { margin:0 0 22px } .question { width:fit-content;max-width:88%;margin-left:auto;padding:11px 15px;border-radius:16px 16px 4px 16px;background:var(--user);white-space:pre-wrap;overflow-wrap:anywhere } .answer { margin-top:12px;white-space:pre-wrap;overflow-wrap:anywhere } .answer-label { margin:0 0 5px;color:var(--accent);font-size:12px;font-weight:750;letter-spacing:.08em;text-transform:uppercase } details { margin-top:15px;border-top:1px solid var(--line);padding-top:12px;color:var(--muted);font-size:13px } summary { cursor:pointer;color:var(--text);font-weight:650 } .source { margin-top:11px;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:color-mix(in srgb,var(--bg) 65%,var(--panel));overflow-wrap:anywhere } .source b { color:var(--text) } .source p { margin:5px 0 0 } .composer { display:flex;gap:10px;margin-top:16px;padding:8px;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--shadow) } textarea { flex:1;min-height:46px;max-height:150px;resize:vertical;border:0;outline:0;padding:11px;background:transparent;color:var(--text);font:inherit } button { align-self:flex-end;min-width:92px;height:44px;border:0;border-radius:11px;background:var(--accent);color:#fff;font:inherit;font-weight:700;cursor:pointer;transition:background .15s,transform .15s } button:hover { background:var(--accent2);transform:translateY(-1px) } button:disabled { opacity:.65;cursor:wait;transform:none } .error { margin:12px 4px 0;color:var(--error);font-size:14px } .hint { margin:12px 4px;color:var(--muted);font-size:12px } .spinner { display:inline-block;width:14px;height:14px;margin-right:8px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;vertical-align:-2px;animation:spin .7s linear infinite } @keyframes spin { to {transform:rotate(360deg)} } @media(max-width:520px) { main{padding-top:30px}.chat{padding:18px}.composer{align-items:stretch}button{min-width:76px} }
  @media(max-width:480px){ main{width:calc(100% - 24px);padding:18px 0}.brand{margin-bottom:12px}.intro{margin:0 0 12px}.chat{min-height:130px}.composer textarea{min-width:0}.welcome{margin:10px auto} }
  </style>
</head>
<body>
  <main>
    <header class="brand"><div class="logo" aria-hidden="true">D</div><div><p class="eyebrow">Documentation support</p><h1>Ask your docs</h1></div></header>
    <p class="intro">Ask a question and inspect the passages cited in the reply.</p>
    <section class="chat" id="chat" aria-live="polite"><div class="welcome"><strong>What can I help you find?</strong>Ask about this site’s documentation.</div></section>
    <form class="composer" id="form"><textarea id="question" aria-label="Your question" placeholder="Ask a question…" rows="1" required></textarea><button id="send" type="submit">Send</button></form>
    <p class="error" id="error" role="alert" hidden></p>
  </main>
  <script>
    const form = document.querySelector('#form');
    const input = document.querySelector('#question');
    const send = document.querySelector('#send');
    const chat = document.querySelector('#chat');
    const errorBox = document.querySelector('#error');

    // Escape document text before inserting it into HTML.
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    }
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const question = input.value.trim();
      if (!question) { errorBox.textContent = 'Please type a question first.'; errorBox.hidden = false; return; }
      errorBox.hidden = true;
      chat.querySelector('.welcome')?.remove();
      const turn = document.createElement('article');
      turn.className = 'turn';
      turn.innerHTML = `<div class="question">${escapeHtml(question)}</div><div class="answer"><p class="answer-label">DocBot</p><span class="loading"><span class="spinner"></span>Looking through the docs…</span></div>`;
      chat.append(turn);
      send.disabled = true; send.textContent = 'Thinking'; input.disabled = true;
      try {
        const response = await fetch('/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({question, site_id: new URLSearchParams(location.search).get('site') || 'orbit'})});
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'DocBot could not answer that. Please try again.');
        const answer = turn.querySelector('.answer');
        answer.innerHTML = `<p class="answer-label">DocBot</p><div>${escapeHtml(data.answer || '')}</div>`;
        if (data.sources?.length) {
          const details = document.createElement('details');
          details.innerHTML = `<summary>Sources (${data.sources.length})</summary>`;
          for (const source of data.sources) {
            const card = document.createElement('div'); card.className = 'source';
            card.innerHTML = `<b>${escapeHtml(source.filename)} · chunk ${escapeHtml(source.chunk_index)}</b><p>${escapeHtml(source.text)}</p>`;
            details.append(card);
          }
          answer.append(details);
        }
      } catch (error) {
        turn.querySelector('.answer').innerHTML = `<p class="answer-label">DocBot</p><div class="error">${escapeHtml(error.message || 'Something went wrong. Please try again.')}</div>`;
      } finally {
        send.disabled = false; send.textContent = 'Send'; input.disabled = false; input.value = ''; input.focus();
        turn.scrollIntoView({behavior:'smooth', block:'nearest'});
      }
    });
    input.addEventListener('keydown', event => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); form.requestSubmit(); } });
  </script>
</body>
</html>
